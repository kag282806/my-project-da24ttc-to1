<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <title>Thiết kế form</title>

    
    <link rel="stylesheet" href="../css/style2.css">
</head>

<body>

<div class="container">

    <form id="frmLogin">

        <h3 class="title">Đăng nhập hệ thống</h3>

        <div class="form-group">
            <label for="txtUsername">Tên đăng nhập:</label>
            <input
                class="form-control"
                type="text"
                id="txtUsername"
                name="txtUsername"
                placeholder="Nhập tên đăng nhập"
                required>
        </div>

        <div class="form-group">
            <label for="txtPassword">Mật khẩu:</label>
            <input
                class="form-control"
                type="password"
                id="txtPassword"
                name="txtPassword"
                placeholder="Nhập mật khẩu"
                required>
        </div>

        <input class="button" type="submit" value="Đăng nhập">
        <input class="button" type="reset" value="Hủy bỏ">

    </form>

</div>

</body>
</html>
