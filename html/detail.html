<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<title>Chi tiết hải sản</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container my-5" style="max-width: 900px;">
    <div class="card shadow-sm p-4 bg-white">

        <a href="page6.html" class="btn btn-secondary mb-3">
            ← Quay lại danh sách
        </a>

        <div class="row g-4 align-items-start">

            <div class="col-md-6">
                <img id="p-image" src="" class="img-fluid rounded">
            </div>

            <div class="col-md-6">
                <h2 id="p-name"></h2>
                <h4 id="p-price" class="text-danger"></h4>
                <hr>
                <p id="p-description" style="text-align: justify; line-height:1.5;"></p>
            </div>

        </div>
    </div>
</div>

<!-- LOAD DATABASE TRƯỚC -->
<script src="../js/lib.js"></script>

<script>
const urlParams = new URLSearchParams(window.location.search);
const productId = urlParams.get('id');

const product = productDatabase.find(function(p){
    return p.id === Number(productId);
});

if(product){
    document.getElementById("p-image").src = product.img;
    document.getElementById("p-name").innerHTML = product.name;
    document.getElementById("p-price").innerHTML = product.price + " VND";
    document.getElementById("p-description").innerHTML = product.desc;
}
</script>

</body>
</html>
